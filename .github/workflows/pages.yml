name: Deploy static website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          python3 build.py
          mkdir _site
          cp *.html _site/
          cp -r assets _site/
          cp .nojekyll robots.txt sitemap.xml _site/
          if [ "${{ vars.CUSTOM_DOMAIN_ENABLED }}" = "true" ]; then cp config/CNAME _site/CNAME; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
